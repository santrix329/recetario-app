<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario - Clientes Web</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="saltar" href="#app">Saltar al contenido</a>

    <!-- la barra de navegacion se monta en esta cabecera -->
    <header id="contenedor-navegacion" class="cabecera"></header>

    <!-- Contenedor principal de la SPA: aqui se intercambian las vistas -->
    <main id="app" tabindex="-1"></main>

    <!-- servicios: no dependen de la interfaz -->
    <script src="js/servicios/recetas.js" defer></script>
    <script src="js/servicios/cache.js" defer></script>
    <script src="js/servicios/api.js" defer></script>

    <!-- pseudocomponentes: primero la base y sus utilidades -->
    <script src="js/utilidades/dom.js" defer></script>
    <script src="js/componentes/Componente.js" defer></script>
    <script src="js/componentes/BarraNavegacion.js" defer></script>

    <!-- vistas: cada una compone pseudocomponentes -->
    <script src="js/vistas/VistaPendiente.js" defer></script>

    <!-- Script principal de arranque -->
    <script src="js/app.js" defer></script>
</body>
</html>
