<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Fogonsón · Recetas de todo el mundo</title>
    <link rel="icon" href="assets/icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/detalle.css">
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="stylesheet" href="css/explorar.css">
    <link rel="stylesheet" href="css/comparador.css">
</head>
<body>
    <a class="saltar" href="#app">Saltar al contenido</a>

    <!-- la barra de navegacion se monta en esta cabecera -->
    <header id="contenedor-navegacion" class="cabecera"></header>

    <!-- Contenedor principal de la SPA: aqui se intercambian las vistas -->
    <main id="app" tabindex="-1"></main>

    <!-- servicios: no dependen de la interfaz -->
    <script src="js/servicios/recetas.js" defer></script>
    <script src="js/servicios/cache.js" defer></script>
    <script src="js/servicios/api.js" defer></script>
    <script src="js/servicios/sesionComparador.js" defer></script>
    <script src="js/servicios/comparacion.js" defer></script>

    <!-- pseudocomponentes: primero la base y sus utilidades -->
    <script src="js/utilidades/dom.js" defer></script>
    <script src="js/componentes/Componente.js" defer></script>
    <script src="js/componentes/BarraNavegacion.js" defer></script>
    <script src="js/componentes/EstadoCarga.js" defer></script>
    <script src="js/componentes/RecetaDestacada.js" defer></script>
    <script src="js/componentes/TarjetaCategoria.js" defer></script>
    <script src="js/componentes/TarjetaReceta.js" defer></script>
    <script src="js/componentes/Paginador.js" defer></script>
    <script src="js/componentes/ListadoRecetas.js" defer></script>
    <script src="js/componentes/Aviso.js" defer></script>
    <script src="js/componentes/DialogoReemplazo.js" defer></script>
    <script src="js/componentes/CabeceraReceta.js" defer></script>
    <script src="js/componentes/ListaIngredientes.js" defer></script>
    <script src="js/componentes/PasosPreparacion.js" defer></script>
    <script src="js/componentes/Pestanas.js" defer></script>
    <script src="js/componentes/ListaOpciones.js" defer></script>
    <script src="js/componentes/EncabezadoFicha.js" defer></script>
    <script src="js/componentes/CampoSugerencias.js" defer></script>
    <script src="js/componentes/FormularioBusqueda.js" defer></script>
    <script src="js/componentes/TablaComparacion.js" defer></script>
    <script src="js/componentes/PanelComparador.js" defer></script>

    <!-- vistas: cada una compone pseudocomponentes -->
    <script src="js/vistas/VistaComparador.js" defer></script>
    <script src="js/vistas/VistaInicio.js" defer></script>
    <script src="js/vistas/VistaDetalle.js" defer></script>
    <script src="js/vistas/VistaCategoriasOrigenes.js" defer></script>
    <script src="js/vistas/VistaExplorar.js" defer></script>

    <!-- Script principal de arranque -->
    <script src="js/app.js" defer></script>
</body>
</html>
